---
title: Configure OEM Information
description: Configures OEM information to contain the EntiForWin version and the EntiForWin Discord server
actions:
  - !powerShell:
    command: |
      $version = 'v0.2.0'

      Write-Output 'Setting boot entry name...'
      bcdedit /set description """EntiForWin $(('10', '11')[[int]([System.Environment]::OSVersion.Version.Build -ge 22000)]) $version"""

      Write-Output 'Setting other versioned OEM information...'
      $reportedVer = """EntiForWin $version"""
      # Shows in Settings
      Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation' -Name 'Model' -Value $reportedVer -Force
      # Shows in winver
      Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' -Name 'RegisteredOrganization' -Value $reportedVer -Force
    wait: true
  - !registryValue:
    path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation'
    value: 'Manufacturer'
    data: 'EntiForWin Team'
    type: REG_SZ
#  - !registryValue:
#    path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation'
#    value: 'SupportURL'
#    data: 'Docs'
#    type: REG_SZ
#  - !registryValue:
#    path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation'
#    value: 'SupportPhone'
#    data: 'Discord'
#    type: REG_SZ
  - !registryValue:
    path: 'HKLM\SOFTWARE\Atmosphere'
    value: 'WinreFallbackFixed'
    data: '1'
    type: REG_SZ

